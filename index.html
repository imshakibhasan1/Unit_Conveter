<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unit Conveter</title>
<style>
    body {
        background-color: #F5F5F5;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        height: 100vh;
        width: 100vw;
        padding: 0;
        margin: 0;
        
    }
/* for align container content center X and Y axis */

    .middleContent {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
    }


    /* main container */
    /* .main {
        height: 80vh;
        width: 40vw;
        border: 4px solid #ffff;
        border-radius:10px;
        
        
    } */
    .main {
    height: auto; /* Allows height to expand naturally if text wraps */
    border: 4px solid #ffffff;
    border-radius: 10px;
    box-sizing: border-box;
}

/* input container */
    .input {
        height: 30%;
        width: 100%;
        background-color: #6A43FE;
        gap: 10px;
        color:aliceblue;
       
     
    }

    .input input{
        padding: 10px 20px;
    }

/* Button Style */
    button {
            font-size: large;
            font-weight: 600;
            letter-spacing: 1px;
            padding: 10px 30px;
            background-color: rgb(35, 44, 62);
            color: aliceblue;
            border-radius: 10px;
            border: none;
            
            
        }
        button:hover {
           background-color: rgb(18, 22, 31);
           
           border-radius: 10px;
        }

        button:active {
            background-color: rgb(21, 42, 63);
            transition: 1s;
        }

/* Result Display container */
    .display {
        height: 70%;
        width: 100%;
        background-color: #F5F5F5;
       
        gap: 20px;
    }


/* result matrix container */
   .showMatrix {
    background-color: #FEFEFE;
    width: 90%;
    height:25%;
    padding: 10px;
   }

   .num {
    font-weight: bold;
    color: #232C3E;
   }
   form {
    width: 100%;
    gap: 10px;
   }
 



/*    
   Media query: Applies ONLY to Desktop / Tablet screens (768px and wider) */
   @media (min-width: 768px) {
       .main {
           width: 100vw; /* Keeps your desired 40% width on desktop */
           height: 100vh;
        }
        form input {
        width: 30%;
        text-align: center;
    }
    }
    
/* Mobile responsive */

    @media (max-width: 440px){
        h1 {
            font-size: 2rem;
            letter-spacing: 1px;
        }

    body {
        padding: 0;
        margin: 0;
    
    }
    
    .main {
        height: 100vh;
        width: 100vw;
        border: none;
        
    }

/* input container */
    .input {
        text-align: center;
        padding: 10px;
    }
    .input button {
        margin-top: 10px;
    }
    form input {
        width: 60%;
        text-align: center;
    }

/* Button Style */
    button {
            font-size: large;
    }
/* Result Display container */
    .display {
        height: 70%;
        width: 100%;
        background-color: #F5F5F5;
        border-radius: 0px 0px 10px 10px ;
        gap: 20px;
    }
    .showMatrix {
        text-align: center;
    }
    .showMatrix span {
        font-size: 16px;
    }
    .showMatrix span {
        font-size: 16px;
    }

    
    }
    

</style>

</head>
<body>
    <div class="main middleContent">
        <div class="input middleContent">
            <h1>Metrix/Imperial Unit Conversion</h1> 
            <form action="#" class="middleContent">
             <input type="number" id="valueInput">
             <button id="btnInput" type="submit">Convert</button>
            </form>
        </div>
        <div class="display middleContent">
            <div class="showMatrix middleContent">
                <h3>Length (Meter/Feet)</h3>
                <span id="miter_feet">
                    <span class="inputValue num">1</span> Meter = 
                    <span id="meterToFeet" class="num">3.28</span> feet |
                    <span class="inputValue num">1</span> Feet = 
                    <span id="feetToMeter" class="num">0.30</span>  Meter
                </span>
            </div>
            <div class="showMatrix middleContent">
                <h3>Volume (Liters/Gallons)</h3>
                <span id="liters_gallons">
                    <span class="inputValue num">1</span> Liters = 
                    <span id="litersToGallons" class="num">0.26</span> Gallons |
                    <span class="inputValue num">1</span> Gallons = 
                    <span id="gallonsToLiters" class="num">3.79</span>  Liters
                </span>
            </div>
            <div class="showMatrix middleContent">
                <h3>Mass (Kilograms/Pounds)</h3>
                <span id="kg_pound">
                    <span class="inputValue num">1</span> Kilograms = 
                    <span id="kgToPound" class="num">2.65</span> Pounds |
                    <span class="inputValue num">1</span> Pounds = 
                    <span id="poundToKg" class="num">0.45</span>  Kilograms
                </span>
            </div>
        </div>

    </div>

    <script src="index.js"></script>
</body>
</html>
